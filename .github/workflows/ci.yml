name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # No Supabase credentials needed: every authenticated route is
        # force-dynamic, so nothing touches the data layer at build time. The
        # production guard that refuses demo mode fires at request time and is
        # covered by tests/security.test.ts.

      - name: Check schema.sql is in sync with the migrations
        run: |
          npm run schema
          if ! git diff --quiet -- supabase/schema.sql; then
            echo "::error::supabase/schema.sql is stale. Run 'npm run schema' and commit the result."
            git diff -- supabase/schema.sql
            exit 1
          fi
